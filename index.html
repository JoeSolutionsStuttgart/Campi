<style id="app-css">
/* Two views on one page: the plain link shows only the app; the link ending in #einstellungen opens the university settings (branding + question radar). App colors come from the three brand colors. */
:root{
  --page-bg:#E8EAEE;
  --page-surface:#FFFFFF;
  --page-field:#F4F5F7;
  --page-fg:#15171C;
  --page-muted:#596070;
  --page-line:#D5D9E0;
  --focus:#2F6FEB;
  --danger:#C23A2B;
  --device:#0D0E11;
  --font:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#0E1013;--page-surface:#181B20;--page-field:#21252C;--page-fg:#ECEEF2;--page-muted:#A3AAB8;--page-line:#2C313A;--focus:#7AA7FF;--danger:#FF8A7A;--device:#000000;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page-bg:#0E1013;--page-surface:#181B20;--page-field:#21252C;--page-fg:#ECEEF2;--page-muted:#A3AAB8;--page-line:#2C313A;--focus:#7AA7FF;--danger:#FF8A7A;--device:#000000;color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--page-bg);color:var(--page-fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#root{min-height:100%}

/* ---------- phone frame (default) ---------- */
.device{width:392px;max-width:100%;height:min(844px, calc(100vh - 56px));min-height:560px;flex:none;padding:11px;border-radius:56px;background:var(--device);box-shadow:0 34px 70px -28px rgba(12,16,28,.55)}
.device .app{border-radius:46px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 30px 2px;font-size:14px;font-weight:700;background:var(--a-bg);color:var(--a-fg);flex:none}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.statusbar .sb-icons i{display:block;background:currentColor;border-radius:2px}
.device .tabbar{padding-bottom:20px}

/* ---------- app-only view ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:28px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
@media (max-width:959.98px){
  html[data-mode="app"], html[data-mode="app"] body{overflow:hidden}
  html[data-mode="app"] body{background:var(--a-page, var(--page-bg))}
  html[data-mode="app"] #root{height:100%}
  .stage{height:100%;padding:0;display:block}
  .stage .device{width:100%;max-width:560px;height:100%;min-height:0;margin-inline:auto;padding:0;border-radius:0;background:none;box-shadow:none}
  .stage .device .app{border-radius:0}
  .stage .statusbar{display:none}
  .stage .device .tabbar{padding-bottom:8px}
}

/* ---------- app shell (colors set from branding) ---------- */
.app{
  --a-primary:#14213D;--a-on-primary:#FFFFFF;--a-primary-ink:#14213D;--a-primary-soft:#E5E7EC;--a-primary-on-soft:#14213D;
  --a-accent:#E8572A;--a-on-accent:#15171C;--a-accent-ink:#A9401C;--a-accent-soft:#FBE4DA;--a-accent-on-soft:#963A19;
  --a-bg:#F7F5F0;--a-surface:#FDFCFA;--a-surface-2:#EEECE7;--a-fg:#171A22;--a-muted:#5A5F6A;--a-line:#E2DED6;--a-hero-muted:#C9CDD6;
  display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;background:var(--a-bg);color:var(--a-fg);font-family:var(--font)
}

function normHex(h){
  if(typeof h !== 'string') return null;
  const m = h.trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!m) return null;

/* shortest walking route on the plan (Dijkstra over the path network) */
const ADJ = {};
EDGES.forEach(e => { const a = NODES[e[0]], b = NODES[e[1]], d = Math.hypot(a[0]-b[0], a[1]-b[1]); (ADJ[e[0]] = ADJ[e[0]] || []).push([e[1], d]); (ADJ[e[1]] = ADJ[e[1]] || []).push([e[0], d]); });
function shortest(from){
  const dist = {}, prev = {}, todo = new Set(Object.keys(NODES));
  Object.keys(NODES).forEach(k => dist[k] = Infinity); dist[from] = 0;
  while(todo.size){
    let u = null; todo.forEach(k => { if(u === null || dist[k] < dist[u]) u = k; });
    if(dist[u] === Infinity) break;
    todo.delete(u);
    (ADJ[u] || []).forEach(([v, d]) => { if(todo.has(v) && dist[u] + d < dist[v]){ dist[v] = dist[u] + d; prev[v] = u; } });
  }
  return {dist, prev};
}
const SP_CACHE = {};
function routeTo(roomId, startId, barrierefrei){
  const r = ROOMS[roomId], bld = BLD[r.b];
  let cands = bld.ent.slice();
  if(barrierefrei){
    const own = cands.filter(e => ENTRANCES[e].bf);
    cands = own.length ? own : Object.keys(BLD).filter(k => BLD[k].group === bld.group).reduce((a, k) => a.concat(BLD[k].ent), []).filter((e, i, arr) => ENTRANCES[e].bf && arr.indexOf(e) === i);
  }
  const sp = SP_CACHE[startId] || (SP_CACHE[startId] = shortest(startId));
  let best = cands[0]; cands.forEach(e => { if(sp.dist[e] < sp.dist[best]) best = e; });
  const path = [best]; while(path[0] !== startId && sp.prev[path[0]]) path.unshift(sp.prev[path[0]]);
  const meters = Math.max(10, Math.round(sp.dist[best] * M_PER_PX / 10) * 10);
  return {entrance:best, path, meters, minutes: Math.max(1, Math.round(meters / 75))};
}

function roomMatches(q){
  const n = norm(q).replace(/\s|\./g,'');
  if(!n) return [];
  return Object.keys(ROOMS).filter(id => {
    const r = ROOMS[id];
    return [r.code, r.name].concat(r.aliases || []).map(x => norm(x).replace(/\s|\./g,'')).some(h => h.includes(n));
  });
}
function roomResults(q){
  if(!q.trim()) return '';
  const ids = roomMatches(q);
  if(!ids.length) return '<div class="results"><p class="empty">Kein Raum gefunden. Versuch es mit einer Nummer wie B 2.03.</p></div>';
  return '<div class="results">' + ids.map(id => '<button class="result" type="button" data-act="room" data-room="' + id + '"><b>' + esc(ROOMS[id].name) + '</b><span>' + esc(ROOMS[id].code) + '</span></button>').join('') + '</div>';
}

function norm(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[’'`´]/g,''); }
function detectLang(q){
  const w = norm(q).split(/[^a-z0-9]+/).filter(Boolean);
  const EN = ['where','what','when','how','can','is','the','my','do','does','i','which','today','register','address','food','open','library','room','find','there','get','to','are'];
  const DE = ['wo','was','wann','wie','ist','der','die','das','ich','mein','meine','kann','gibt','heute','und','ein','eine','hat','komme','man','gibts','zur','zum','im'];
  let e = 0, d = 0;
  w.forEach(x => { if(EN.includes(x)) e++; if(DE.includes(x)) d++; });
  return e > d ? 'en' : 'de';
}
function roomFromText(q){
  const m = q.match(/\b([abc])\s?([0-9])\s?[.,]?\s?([0-9]{2})\b/i);
  if(m){ const id = (m[1] + m[2] + m[3]).toUpperCase(); return {id: ROOMS[id] ? id : null, code: m[1].toUpperCase() + ' ' + m[2] + '.' + m[3]}; }
  return null;
}
function placeFromText(n){
  for(const id of Object.keys(ROOMS)){ const al = ROOMS[id].aliases; if(al && al.some(a => n.includes(norm(a)))) return id; }
  return null;
}
function dishesText(lang, veganOnly, vegOnly){
  const day = MENSA[TODAY_IDX];
  let list = day;
  if(veganOnly) list = day.filter(d => d.t === 'vegan');
  else if(vegOnly) list = day.filter(d => d.t === 'vegan' || d.t === 'vegetarisch');
  const parts = list.map(d => d.n + ' (' + euro(d.p) + (lang === 'en' ? ', counter ' : ', Ausgabe ') + d.o + ')');
  const pre = WEEKEND ? (lang === 'en' ? 'The cafeteria is closed at the weekend. On Monday you can get: ' : 'Am Wochenende ist die Mensa geschlossen. Am Montag gibt es: ') : (lang === 'en' ? 'Today at Mensa Mitte: ' : 'Heute in der Mensa Mitte: ');
  return pre + parts.join('; ') + '.';
}
function answer(q){

function readLog(){ try { const a = JSON.parse(lsGet(LOG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
function addLog(entry){ const a = readLog(); a.unshift(entry); lsSet(LOG_KEY, JSON.stringify(a.slice(0, 40))); }

function ask(q, src){
  q = (q || '').trim();
  if(!q || state.typing) return;
  state.chat.push({role:'user', text:q});
  studyOnAsk(q, src);
  const res = answer(q);
  addLog({q: q.slice(0,140), ok: res.ok, topic: res.topic, t: Date.now()});
  state.typing = true;
  const log = $('chat-log');
  if(log){
    log.insertAdjacentHTML('beforeend', msgHTML({role:'user', text:q}) + typingHTML());
    log.scrollTop = log.scrollHeight;
    const sg = $('suggest'); if(sg) sg.innerHTML = suggestHTML();
  }
  setTimeout(() => {
    state.typing = false;
    state.chat.push(res.msg);
    const lg = $('chat-log');
    if(lg){
      const t = $('typing'); if(t) t.remove();
      lg.insertAdjacentHTML('beforeend', msgHTML(res.msg));
      lg.scrollTop = lg.scrollHeight;
      const sg = $('suggest'); if(sg) sg.innerHTML = suggestHTML();
    }
    studyOnAnswer(res);
  }, REDUCED ? 150 : 650 + Math.min(900, q.length * 14));
}

/* ================= Saving =================
   "Speichern" does two things: it keeps a copy on this device (so the next visit here shows it)
   and republishes the page through the artifact capability (so everyone sees it). */
let artifactApi = null, apiState = 'pending', readOnly = false, saving = false, saveMsg = '', saveErr = false;
const apiReady = (async () => {
  try { artifactApi = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('artifact') : null; } catch(e){ artifactApi = null; }
  apiState = artifactApi ? 'ready' : 'none';
  renderSaveBar();
  return artifactApi;
})();
function waitApi(ms){ return Promise.race([apiReady, new Promise(r => setTimeout(() => r(artifactApi), ms))]); }
function writeLocal(b, ts){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Object.assign(cleanBranding(b), {savedAt: ts}))); return lsGet(LOCAL_KEY) !== null; }
  catch(e){ return false; }
}
const NO_WRITE = ['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'];
function renderSaveBar(){
  const el = $('save-bar'); if(!el) return;
  const dirty = !sameBranding(state.draft, SHARED);
  const canPublish = apiState !== 'none' && !readOnly;
  const btn = (label, act, on) => '<button class="btn-brand" type="button"' + (act ? ' data-act="' + act + '"' : '') + (on && !saving ? '' : ' disabled') + '>' + icon('check') + (saving ? 'Wird gespeichert …' : label) + '</button>';
  let label, cls = '', actions = '';
  if(dirty){
    label = 'Nicht gespeicherte Änderungen'; cls = ' dirty';
    actions = '<button class="btn-ghost" type="button" data-act="discard"' + (saving ? ' disabled' : '') + '>Verwerfen</button>' + btn('Speichern', 'save', true);
  } else if(LOCAL){
    label = 'Auf diesem Gerät gespeichert · ' + fmtTime(LOCAL.savedAt); cls = ' local';
    actions = '<button class="btn-ghost" type="button" data-act="drop-local"' + (saving ? ' disabled' : '') + '>Gerätekopie löschen</button>' + (canPublish ? btn('Für alle speichern', 'save', true) : '');
  } else {
    label = PAGE_SAVED_AT ? 'Für alle gespeichert · ' + fmtTime(PAGE_SAVED_AT) : 'Alles gespeichert';
    actions = btn('Speichern', '', false);
  }
  let h = '<span class="save-state' + cls + '">' + esc(label) + '</span><div class="save-actions">' + actions + '</div>';
  if(saveMsg) h += '<p class="status' + (saveErr ? ' error' : '') + '" role="status">' + esc(saveMsg) + '</p>';
  else if(!dirty && LOCAL) h += '<p class="status">' + (canPublish
    ? 'Andere Geräte zeigen noch den vorherigen Stand. Mit „Für alle speichern“ gilt er überall.'
    : 'Andere Geräte zeigen noch den vorherigen Stand. Für alle speichern geht, wenn du die App als Besitzer auf claude.ai öffnest, im Browser oder in der Desktop-App.') + '</p>';
  else if(dirty && apiState === 'none') h += '<p class="status">In dieser Ansicht wird nur auf diesem Gerät gespeichert.</p>';
  el.innerHTML = h;
}
function getResetCss(){
  try { const s = document.head && document.head.querySelector('style'); if(s && s.textContent.length < 2000 && s.textContent.includes('safe-area')) return s.textContent; } catch(e){}
  return ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

function buildDocument(b, ts){
  const css = $('app-css').textContent;
  const js = $('app-js').textContent;
  const data = JSON.stringify(Object.assign(cleanBranding(b), {savedAt: ts || new Date().toISOString()})).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + getResetCss() + '</style></head><body>' +

async function save(){
  if(saving) return;
  const dirty = !sameBranding(state.draft, SHARED);
  if(!dirty && !LOCAL) return;
  const b = cleanBranding(dirty ? state.draft : SHARED);
  const ts = new Date().toISOString();
  saving = true; saveMsg = ''; saveErr = false; renderSaveBar();

  // 1. copy on this device
  const localOk = writeLocal(b, ts);
  // 2. republish the page for everyone
  const api = await waitApi(12000);
  let code = null;
  if(!api) code = 'unavailable';
  else if(readOnly) code = 'not_writer';
  else {
    ssSet(AFTER_SAVE_KEY, '1');
    for(let attempt = 0; attempt < 2; attempt++){
      try { await api.publish(buildDocument(b, ts)); code = null; break; }
      catch(e){
        code = (e && typeof e.code === 'string') ? e.code : 'upstream_error';
        if(code !== 'upstream_error' || attempt) break;
        await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      }
    }
    if(code) ssDel(AFTER_SAVE_KEY);
  }
  saving = false;

  if(!code){
    PAGE = b; PAGE_SAVED_AT = ts; LOCAL = null; SHARED = b;
    state.draft = b; ssDel(DRAFT_KEY);
    saveMsg = 'Gespeichert, für alle und dauerhaft. Die App lädt gleich neu.';
    renderSaveBar(); return;
  }
  if(NO_WRITE.includes(code)) readOnly = true;
  if(!localOk){
    saveErr = true;
    saveMsg = 'Speichern hat nicht geklappt (' + code + '). ' + (code === 'too_large' ? 'Bitte ein kleineres Logo wählen.' : 'Bitte die App als Besitzer auf claude.ai öffnen, im Browser oder in der Desktop-App, und dort speichern.');
    renderSaveBar(); return;
  }
  LOCAL = {b, savedAt: ts}; SHARED = b; state.draft = b; state.b = state.mode === 'admin' ? b : SHARED; ssDel(DRAFT_KEY);
  const pre = 'Auf diesem Gerät gespeichert. ';
  if(code === 'unavailable' || NO_WRITE.includes(code)) saveMsg = pre + 'Für alle speichern geht in dieser Ansicht nicht (' + code + '). Öffne die App dafür als Besitzer auf claude.ai, im Browser oder in der Desktop-App.';
  else if(code === 'conflict') saveMsg = pre + 'Gleichzeitig wurde eine andere Version gespeichert, die Seite lädt neu. Tippe danach auf „Für alle speichern“.';

function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function handleLogo(file){
  const st = $('logo-status');
  const say = (t, err) => { if(st){ st.textContent = t; st.classList.toggle('status', true); st.classList.toggle('error', !!err); } };
  if(!file) return;
  if(!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)){ say('Diese Datei ist kein Bild. Bitte PNG, SVG oder JPG wählen.', true); return; }
  try {
    const url = await readFile(file);
    if(file.type === 'image/svg+xml'){
      if(url.length > 350000){ say('Die SVG-Datei ist zu groß. Bitte eine kleinere Datei oder ein PNG wählen.', true); return; }
      update({logo:url}); say('Logo übernommen.'); return;
    }
    const img = await loadImg(url);
    const s = Math.min(1, 480 / img.naturalWidth, 192 / img.naturalHeight);
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    let out = c.toDataURL('image/png');
    if(out.length > 350000) out = c.toDataURL('image/webp', 0.9);
    update({logo:out}); say('Logo übernommen.');
  } catch(e){ say('Das Bild konnte nicht gelesen werden. Bitte eine andere Datei versuchen.', true); }
}

/* ================= App-Test (Studien-Modus mit Datenerhebung) =================
   Aktiv über config.js (studie: true) oder einen Link, der auf #studie endet. #vorschau = Probelauf ohne Speichern.
   Ablauf: Einwilligung -> 3 Aufgaben (H4 Raumsuche, H5 KI-Assistent, H6 freies Erkunden) -> Fragenkatalog aus der Datenbank.
   Daten: Sitzung, alle Ereignisse (Ansichten, Klicks, Suchen, Chat, Frust- und Leerklicks, Sichtbarkeit, Fehler),
   Ergebnisse und Antworten. Mit Supabase-Zugang in config.js gehen sie an die Datenbank, sonst bleiben sie auf dem Gerät. */
const STUDY_VERSION = '2026-10-b';
const OUTBOX_KEY = 'campi-outbox-v2', STUDY_DONE_KEY = 'campi-studie-fertig-v1';
const T1_ROOM = 'A105';
const DEFAULT_QUESTIONS = [

  {id:null, schluessel:'wichtigste', typ:'einfach', frage:'Was ist dir an Campi am wichtigsten?', optionen:['Raumsuche','Mensa','KI-Assistent','Fristen und Kontakte','Stadtleben'], pflicht:true},
  {id:null, schluessel:'kommentar', typ:'text', frage:'Was fehlt dir oder hat dich gestört?', optionen:[], pflicht:false}

function b64urlJSON(part){
  try { let s = part.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch(e){ return null; }
}
function isSecretKey(k){
  if(/^sb_secret_/i.test(k)) return true;
  if(/^eyJ/.test(k)){ const p = b64urlJSON(k.split('.')[1] || ''); return !!(p && p.role === 'service_role'); }
  return false;
}
const CFG = (() => {
  const c = {studie:false, url:'', key:'', kontakt:'', projekt:'Studienprojekt Campi', problem:''};
  let src = {};
  try { const el = document.getElementById('study-config'); if(el) src = JSON.parse(el.textContent) || {}; } catch(e){}
  if(window.CAMPI_CONFIG && typeof window.CAMPI_CONFIG === 'object') src = Object.assign({}, src, window.CAMPI_CONFIG);
  c.studie = src.studie === true;
  const url = String(src.supabaseUrl || '').trim().replace(/\/+$/, '');
  const key = String(src.supabaseKey || '').trim();
  if((/^https:\/\/[^\s/]+$/.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url)) && !/DEIN/i.test(url)) c.url = url;
  if(key && !/DEIN/i.test(key)){ if(isSecretKey(key)) c.problem = 'secret'; else c.key = key; }
  if(typeof src.kontakt === 'string') c.kontakt = src.kontakt.trim().slice(0, 120);
  if(typeof src.projekt === 'string' && src.projekt.trim()) c.projekt = src.projekt.trim().slice(0, 80);
  if(c.problem === 'secret') console.error('Campi: In config.js steht ein geheimer Schlüssel (secret/service_role). Er wird nicht benutzt. Bitte durch den publishable/anon key ersetzen und den geheimen Schlüssel in Supabase neu erzeugen.');
  return c;
})();
const REMOTE = !!(CFG.url && CFG.key);
const SB = {
  headers(){ const h = {'apikey': CFG.key, 'Content-Type': 'application/json'}; if(/^eyJ/.test(CFG.key)) h.Authorization = 'Bearer ' + CFG.key; return h; },
  async rpc(fn, body, keepalive){
    const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, {method:'POST', headers: this.headers(), body: JSON.stringify(body), keepalive: !!keepalive});
    if(!r.ok){ const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
    return r.json().catch(() => null);
  },
  async get(path){
    const r = await fetch(CFG.url + '/rest/v1/' + path, {headers: this.headers()});
    if(!r.ok){ const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
    return r.json();
  }
};
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const a = new Uint8Array(16); crypto.getRandomValues(a); a[6] = (a[6] & 15) | 64; a[8] = (a[8] & 63) | 128;
  const h = Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0,8) + '-' + h.slice(8,12) + '-' + h.slice(12,16) + '-' + h.slice(16,20) + '-' + h.slice(20);
}

/* outbox: everything waits here until the database confirms it (or stays here without database) */
const OB = (() => {
  const empty = {sitzungen:[], ereignisse:[], ergebnisse:[], antworten:[], gesendet:[]};
  try { const o = JSON.parse(lsGet(OUTBOX_KEY) || 'null'); if(o && typeof o === 'object') Object.keys(empty).forEach(k => { if(Array.isArray(o[k])) empty[k] = o[k]; }); } catch(e){}
  return empty;
})();
let persistTimer = null;
function persistOutbox(now){
  clearTimeout(persistTimer);
  const write = () => { OB.ereignisse = OB.ereignisse.slice(-4000); OB.gesendet = OB.gesendet.slice(-100); lsSet(OUTBOX_KEY, JSON.stringify(OB)); };
  if(now) write(); else persistTimer = setTimeout(write, 400);
}
function enqueue(table, row){ if(ST.preview) return; OB[table].push(row); persistOutbox(); scheduleFlush(); }
function pendingCount(){ return OB.sitzungen.length + OB.ereignisse.length + OB.ergebnisse.length + OB.antworten.length; }
let flushing = null, flushTimer = null;
function scheduleFlush(ms){ if(!REMOTE) return; clearTimeout(flushTimer); flushTimer = setTimeout(() => { flush(); }, ms == null ? 2500 : ms); }
function flush(keepalive){
  if(!REMOTE || !pendingCount()) return Promise.resolve(!pendingCount());
  if(flushing) return flushing;
  const sess = OB.sitzungen.slice(0, 5);
  const allowed = new Set(OB.gesendet.concat(sess.map(s => s.id)));
  const pick = (arr, n, key) => { const out = []; for(const it of arr){ if(out.length >= n) break; if(allowed.has(it[key])) out.push(it); } return out; };
  const batch = {sitzungen: sess, ereignisse: pick(OB.ereignisse, keepalive ? 60 : 250, 'sitzung_id'), ergebnisse: pick(OB.ergebnisse, 5, 'sitzung_id'), antworten: pick(OB.antworten, 100, 'sitzung_id')};
  const n = batch.sitzungen.length + batch.ereignisse.length + batch.ergebnisse.length + batch.antworten.length;
  if(!n) return Promise.resolve(false);
  const drop = () => {
    ['sitzungen','ereignisse','ergebnisse','antworten'].forEach(k => { const s = new Set(batch[k]); OB[k] = OB[k].filter(x => !s.has(x)); });
    sess.forEach(s => { if(!OB.gesendet.includes(s.id)) OB.gesendet.push(s.id); });
    persistOutbox(true);
  };
  flushing = SB.rpc('test_speichern', {daten: batch}, keepalive)
    .then(() => { drop(); return true; })
    .catch(e => { if(e && e.status === 400) drop(); return false; })
    .then(ok => { flushing = null; if(ok && pendingCount() && !keepalive) return flush(); return ok && !pendingCount(); });
  return flushing;
}

    const v = ST.answers[i];
    if(v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;
    enqueue('antworten', {id: uuid(), sitzung_id: ST.sid, frage_id: q.id || null, frage: q.frage.slice(0, 300), typ: q.typ, wert: v});
  });
  track('abgeschlossen', {dauer_sekunden: dur});
  if(!ST.preview) lsSet(STUDY_DONE_KEY, new Date().toISOString());
  setStep('sending');
  let ok = false;
  if(REMOTE && !ST.preview){ ok = await flush(); if(!ok){ await new Promise(res => setTimeout(res, 1500)); ok = await flush(); } }
  ST.sent = ST.preview ? 'preview' : (REMOTE ? (ok ? 'ok' : 'queued') : 'local');
  setStep('thanks');
}

/* CSV export of the data that is still on this device (mode without database) */
function csvCell(v){
  let s = typeof v === 'number' ? String(v).replace('.', ',') : Array.isArray(v) ? v.join(', ') : (v && typeof v === 'object') ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v);
  if(/^[=+\-@]/.test(s)) s = "'" + s;
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvFrom(rows, cols){ return '﻿' + [cols.join(';')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(';'))).join('\r\n'); }
function studyCSV(){
  const res = {}; OB.ergebnisse.forEach(r => res[r.sitzung_id] = r);
  const ans = {}; OB.antworten.forEach(a => { (ans[a.sitzung_id] = ans[a.sitzung_id] || {})[a.frage] = a.wert; });
  const qcols = Array.from(new Set(OB.antworten.map(a => a.frage)));
  const scols = ['id','gruppe','geraet','betriebssystem','browser','semester','letzte_raumsuche','quelle'];
  const rcols = ['a1_ergebnis','a1_sekunden','a1_tipps','a1_weg','a1_verstaendlich','a2_ergebnis','a2_sekunden','a2_fragen','a2_vertrauen','a2_lieber','a3_sekunden','a3_bereiche','dauer_sekunden'];
  const rows = OB.sitzungen.map(s => { const o = Object.assign({}, s, res[s.id] || {}); qcols.forEach(q => o[q] = (ans[s.id] || {})[q]); return o; });
  return csvFrom(rows, scols.concat(rcols, qcols));
}
async function downloadCSV(filename, data){
  let dl = null;
  try { dl = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; } catch(e){ dl = null; }
  if(dl){
    try { await dl.save({filename, data}); }
    catch(e){ if(!e || e.code !== 'declined') toast('Die Datei kann in dieser Ansicht nicht gespeichert werden.'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'text/csv;charset=utf-8'}));
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function readStudyForm(f){
  const out = {};
  new FormData(f).forEach((v, k) => { out[k] = out[k] === undefined ? v : [].concat(out[k], v); });
  return out;
}
function requireFields(f, names){
  const d = readStudyForm(f);
  const missing = names.filter(n => d[n] === undefined || d[n] === '');
  f.querySelectorAll('.st-missing').forEach(el => el.classList.remove('st-missing'));
  missing.forEach(n => { const inp = f.querySelector('[name="' + n + '"]'); const box = inp && (inp.closest('.st-q') || inp.closest('.st-check')); if(box) box.classList.add('st-missing'); });
  const err = f.querySelector('.st-err');
  if(missing.length){
    if(err) err.textContent = (missing.length === 1 && missing[0] === 'einwilligung') ? 'Bitte bestätige die Einwilligung, um teilzunehmen.' : 'Bitte beantworte die markierten Fragen.';
    const first = f.querySelector('.st-missing input, .st-missing textarea'); if(first) try { first.focus(); } catch(e){}
    return null;
  }
  if(err) err.textContent = '';
  return d;
}

      else if(it.q.typ === 'text'){ const t = String(raw).trim().slice(0, 1000); if(t) ST.answers[it.idx] = t; }
      else ST.answers[it.idx] = String(raw);

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act;
  studyOnAction(a, t);
  switch(a){
    case 'tab': go(t.dataset.tab); break;
    case 'route': state.roomQuery = ''; go('rooms', {room:t.dataset.room}); break;
    case 'room': state.room = t.dataset.room; state.roomQuery = ''; renderScreen(true); break;
    case 'start': state.start = t.dataset.start; renderScreen(true); break;
    case 'bf': state.bf = !state.bf; renderScreen(true); break;
    case 'map-zoom': openMapOverlay(); break;
    case 'map-close': closeMapOverlay(); { const z = document.querySelector('[data-act="map-zoom"]'); if(z) z.focus(); } break;
    case 'discover': go('discover', {seg:t.dataset.seg}); break;
    case 'seg': state.discover = t.dataset.seg; renderScreen(true); break;
    case 'cat': state.cat = t.dataset.cat; renderScreen(true); break;
    case 'day': state.day = +t.dataset.day; renderScreen(true); break;
    case 'filter': { const k = t.dataset.f; state.filters[k] = !state.filters[k]; if(k === 'vegan' && state.filters.vegan) state.filters.veggie = false; if(k === 'veggie' && state.filters.veggie) state.filters.vegan = false; renderScreen(true); break; }
    case 'suggest': ask(t.dataset.q, 'vorschlag'); break;
    case 'to-app': openApp(); break;
    case 'admin-tab': state.adminTab = t.dataset.t; render(); break;
    case 'admin-view': state.adminView = t.dataset.v; { const g = document.querySelector('.admin-grid'); if(g) g.dataset.view = state.adminView; document.querySelectorAll('[data-act="admin-view"]').forEach(btn => btn.setAttribute('aria-selected', String(btn.dataset.v === state.adminView))); } break;
    case 'preset': { const p = PRESETS[+t.dataset.i]; update({primary:p.primary, accent:p.accent, background:p.background}); break; }
    case 'remove-logo': update({logo:null}); { const st = $('logo-status'); if(st){ st.textContent = 'Logo entfernt.'; st.classList.remove('error'); } } break;
    case 'drop-local': lsDel(LOCAL_KEY); LOCAL = null; SHARED = PAGE; state.draft = SHARED; ssDel(DRAFT_KEY); saveMsg = ''; saveErr = false; render(); break;
    case 'discard': state.draft = SHARED; state.b = SHARED; ssDel(DRAFT_KEY); saveMsg = ''; applyBranding(); if(state.tab === 'chat' || state.tab === 'discover') renderScreen(true); syncForm(); break;
    case 'save': save(); break;
    case 'clear-log': lsDel(LOG_KEY); render(); break;
    case 'study-csv': downloadCSV('campi-app-test-durchlaeufe-' + new Date().toISOString().slice(0,10) + '.csv', studyCSV()); break;
    case 'study-csv-events': downloadCSV('campi-app-test-ereignisse-' + new Date().toISOString().slice(0,10) + '.csv', csvFrom(OB.ereignisse, ['sitzung_id','zeit_ms','typ','schritt','ansicht','daten'])); break;
    case 'study-clear':
      if(studyClearArmed){ ['sitzungen','ereignisse','ergebnisse','antworten'].forEach(k => OB[k] = []); persistOutbox(true); studyClearArmed = false; }
      else { studyClearArmed = true; setTimeout(() => { if(!studyClearArmed) return; studyClearArmed = false; if(state.mode === 'admin' && state.adminTab === 'radar') render(); }, 6000); }
      render(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  const input = f.querySelector('input'); const q = input ? input.value : '';
  if(!q.trim()) return;
  if(f.dataset.form === 'ask-home'){ go('chat'); ask(q, 'start'); }
  else { input.value = ''; ask(q, 'eingabe'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'room-q'){ studyOnSearch(t.value); state.roomQuery = t.value; const r = $('room-results'); if(r) r.innerHTML = roomResults(t.value); return; }
  if(t.id === 'f-name'){ update({name: t.value.trim() ? t.value : BASE.name}); return; }
  if(t.id === 'f-city'){ update({city: t.value.trim() ? t.value : BASE.city}); return; }
  if(t.dataset.color){ update({[t.dataset.color]: t.value}); return; }
  if(t.dataset.hex){
    const h = normHex(t.value);
    if(h && t.value.replace('#','').length === 6){ t.removeAttribute('aria-invalid'); update({[t.dataset.hex]: h}); }
    else t.setAttribute('aria-invalid', 'true');
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'f-logo'){ handleLogo(t.files && t.files[0]); t.value = ''; }
  if(t.dataset.hex){ const h = normHex(t.value); if(h){ t.value = h; t.removeAttribute('aria-invalid'); update({[t.dataset.hex]: h}); } else { t.value = state.draft[t.dataset.hex]; t.removeAttribute('aria-invalid'); } }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if(d){ e.preventDefault(); d.classList.remove('over'); handleLogo(e.dataTransfer.files && e.dataTransfer.files[0]); } });

/* hidden way into the settings: hold the university name in the app bar for 1.5 seconds */
let pressTimer = null;
document.addEventListener('pointerdown', e => {
  if(state.mode !== 'app' || ST.active || !e.target.closest('#brand')) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressTimer = null; openAdmin(); }, 1500);
});
['pointerup','pointercancel','pointerleave'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; }, true));
document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('#brand')) e.preventDefault(); });

document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('map-overlay')){ closeMapOverlay(); const z = document.querySelector('[data-act="map-zoom"]'); if(z) z.focus(); } });
window.addEventListener('hashchange', render);
window.addEventListener('hashchange', () => { if(wantsAdmin()) return; if(previewWanted()) startStudy(true); else if(studyWanted()) startStudy(false); });
window.addEventListener('storage', e => {
  if(e.key === LOG_KEY && state.mode === 'admin' && state.adminTab === 'radar') render();
  if(e.key === LOCAL_KEY && !saving){
    const dirty = !sameBranding(state.draft, SHARED);
    LOCAL = readLocal(); SHARED = pickShared();
    if(!dirty){ state.draft = SHARED; ssDel(DRAFT_KEY); }
    render();
  }
});
document.addEventListener('dblclick', e => { if(state.mode === 'app' && !ST.active && e.target.closest && e.target.closest('#brand')) openAdmin(); });

/* ================= Boot ================= */
function tick(){ const sb = $('sb-time'); if(sb){ const d = new Date(); sb.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); } }
setInterval(tick, 30000);
if(ssGet(AFTER_SAVE_KEY)){
  ssDel(AFTER_SAVE_KEY);
  if(!wantsAdmin()){ try { history.replaceState(null, '', '#einstellungen'); } catch(e){} }
  setTimeout(() => toast('Gespeichert, für alle und dauerhaft.'), 300);
}
render();
if(state.mode === 'app'){
  if(previewWanted()) startStudy(true);
  else if(studyWanted() || (CFG.studie && !studyDone())) startStudy(false);
}
if(REMOTE && pendingCount()) flush();
})();
</script>
</body>
</html>

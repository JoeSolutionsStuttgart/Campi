<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --field:#f1f0ec; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s1-soft:#cde2fb; --s2:#eb6834;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b42d2d;
  --btn:#0b0b0b; --btn-ink:#fcfcfb; --focus:#2a78d6;
  --font:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --field:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926;
    --good-ink:#0ca30c; --warn-ink:#fab219; --crit-ink:#e66767;
    --btn:#f0efec; --btn-ink:#0d0d0d; --focus:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --field:#242422; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926;
  --good-ink:#0ca30c; --warn-ink:#fab219; --crit-ink:#e66767;
  --btn:#f0efec; --btn-ink:#0d0d0d; --focus:#3987e5;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand p{font-size:13px;color:var(--ink2)}
.top-actions{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:11px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-2{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn-link{background:none;border:0;padding:4px 2px;min-height:36px;color:var(--ink2);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:none;border:1px solid var(--border);color:var(--crit-ink);min-height:36px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px}
.btn-danger.armed{background:var(--crit);border-color:var(--crit);color:#fff}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}

/* hypotheses */
.hyp{display:flex;flex-direction:column;gap:10px}

.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}

.status.warn{color:var(--warn-ink)} .status.warn .dot{background:var(--warn);color:#0b0b0b}

.meter{position:relative;height:12px;border-radius:6px;background:var(--s1-soft)}

.bt{position:relative;height:14px;border-left:1px solid var(--axis)}

.bv small{font-weight:600;color:var(--ink2);margin-left:6px;font-size:12.5px}

/* questions editor */
.q-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grid)}

/* table */
.table-wrap{overflow-x:auto;border-top:1px solid var(--grid)}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}

.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.timeline{display:flex;flex-direction:column;font-size:13px}
.tl-row{display:grid;grid-template-columns:58px 120px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--grid)}

.tl-row .y{font-weight:700}
.tl-row .d{color:var(--ink2);overflow-wrap:anywhere}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:640px){
  .bar-row{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}

  .tl-row .d{grid-column:2}
  .card{padding:16px}
}

<body>
<div id="app"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script>
(function(){
'use strict';

/* ================= Konfiguration ================= */
const RAW = (window.CAMPI_CONFIG && typeof window.CAMPI_CONFIG === 'object') ? window.CAMPI_CONFIG : null;
function b64urlJSON(part){ try { let s = part.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch(e){ return null; } }
function isSecretKey(k){ if(/^sb_secret_/i.test(k)) return true; if(/^eyJ/.test(k)){ const p = b64urlJSON(k.split('.')[1] || ''); return !!(p && p.role === 'service_role'); } return false; }
const CONF = (() => {
  const c = {url:'', key:'', problem:''};
  if(!RAW){ c.problem = 'fehlt'; return c; }
  const url = String(RAW.supabaseUrl || '').trim().replace(/\/+$/, '');
  const key = String(RAW.supabaseKey || '').trim();
  if(!url || /DEIN/i.test(url) || !(/^https:\/\/[^\s/]+$/.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url))) c.problem = 'url';
  else c.url = url;
  if(!key || /DEIN/i.test(key)) c.problem = c.problem || 'key';
  else if(isSecretKey(key)) c.problem = 'secret';
  else c.key = key;
  return c;
})();

/* ================= Hilfen ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n, d) => (n === null || n === undefined || isNaN(n)) ? '–' : Number(n).toLocaleString('de-DE', {maximumFractionDigits: d === undefined ? 1 : d, minimumFractionDigits: 0});
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const pctTxt = v => v === null || v === undefined ? '–' : v + ' %';
function median(a){ const v = a.filter(x => typeof x === 'number' && !isNaN(x)).sort((x, y) => x - y); if(!v.length) return null; const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; }
function mean(a){ const v = a.filter(x => typeof x === 'number' && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; }
function dur(sec){ if(sec === null || sec === undefined || isNaN(sec)) return '–'; sec = Math.round(sec); if(sec < 60) return sec + ' s'; return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') + ' Min.'; }
function when(iso){
  if(!iso) return '–'; const t = Date.parse(iso), d = (Date.now() - t) / 1000;
  if(d < 60) return 'gerade eben'; if(d < 3600) return 'vor ' + Math.floor(d / 60) + ' Min.'; if(d < 86400) return 'vor ' + Math.floor(d / 3600) + ' Std.';
  return new Date(t).toLocaleString('de-DE', {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
}
function dt(iso){ return iso ? new Date(iso).toLocaleString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : ''; }
function countBy(arr, fn){ const m = new Map(); arr.forEach(x => { const k = fn(x); if(k === null || k === undefined || k === '') return; m.set(k, (m.get(k) || 0) + 1); }); return m; }
function topItems(map, n){ return Array.from(map.entries()).sort((a, b) => b[1] - a[1]).slice(0, n || 99).map(([label, value]) => ({label, value})); }
const I = {
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', alert:'<path d="M12 7v6M12 17h.01"/>', minus:'<path d="M7 12h10"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>', down:'<path d="M12 5v14M6 13l6 6 6-6"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>', plus:'<path d="M12 5v14M5 12h14"/>', refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>',
  out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>', eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  down2:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>', ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'
};
const icon = n => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + I[n] + '</svg>';

/* ================= Supabase ================= */
const AUTH_KEY = 'campi-admin-auth-v1', UI_KEY = 'campi-admin-ui-v1';
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function hdrs(token){ const h = {'apikey': CONF.key, 'Content-Type': 'application/json'}; const t = token || (/^eyJ/.test(CONF.key) ? CONF.key : ''); if(t) h.Authorization = 'Bearer ' + t; return h; }
async function authCall(grant, body){
  let r;
  try { r = await fetch(CONF.url + '/auth/v1/token?grant_type=' + grant, {method:'POST', headers: hdrs(), body: JSON.stringify(body)}); }
  catch(e){ throw new Error('Supabase ist nicht erreichbar. Stimmt die Adresse in config.js?'); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok){
    const m = j.error_description || j.msg || j.message || '';
    throw new Error(/invalid login credentials/i.test(m) ? 'E-Mail oder Passwort stimmen nicht.' : /email not confirmed/i.test(m) ? 'Die E-Mail-Adresse ist noch nicht bestätigt.' : (m || 'Anmeldung fehlgeschlagen (' + r.status + ').'));
  }
  return j;
}
function setAuth(j, email){
  S.auth = {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), email: (j.user && j.user.email) || email || (S.auth && S.auth.email) || ''};
  lsSet(AUTH_KEY, JSON.stringify(S.auth));
}
let refreshing = null;
function refreshToken(){
  if(!S.auth || !S.auth.refresh_token) return Promise.reject(new Error('Bitte melde dich an.'));
  if(!refreshing) refreshing = authCall('refresh_token', {refresh_token: S.auth.refresh_token}).then(j => { setAuth(j); }).finally(() => { refreshing = null; });
  return refreshing;
}
async function api(path, o){
  o = o || {};
  if(!S.auth) throw new Error('Bitte melde dich an.');
  if(S.auth.expires_at - 60 < Date.now() / 1000){ try { await refreshToken(); } catch(e){ logout('Deine Anmeldung ist abgelaufen. Bitte melde dich erneut an.'); throw e; } }
  const go = () => fetch(CONF.url + '/rest/v1/' + path, {method: o.method || 'GET', headers: Object.assign(hdrs(S.auth.access_token), o.prefer ? {Prefer: o.prefer} : {}), body: o.body === undefined ? undefined : JSON.stringify(o.body)});
  let r;
  try { r = await go(); } catch(e){ throw new Error('Supabase ist nicht erreichbar. Prüfe die Internetverbindung und die Adresse in config.js.'); }
  if(r.status === 401){ try { await refreshToken(); r = await go(); } catch(e){} }
  if(r.status === 401){ logout('Deine Anmeldung ist abgelaufen. Bitte melde dich erneut an.'); throw new Error('Nicht angemeldet.'); }
  const text = await r.text();
  let j = null; try { j = text ? JSON.parse(text) : null; } catch(e){}
  if(!r.ok) throw new Error((j && (j.message || j.hint)) || ('Fehler ' + r.status));
  return j;
}
async function fetchAll(path){
  const out = [];
  for(let off = 0; off < 500000; off += 1000){
    const rows = await api(path + (path.includes('?') ? '&' : '?') + 'limit=1000&offset=' + off);
    if(!Array.isArray(rows)) break;
    out.push.apply(out, rows);
    if(rows.length < 1000) break;
  }
  return out;
}

/* ================= Zustand ================= */
const S = {
  auth: (() => { try { const a = JSON.parse(lsGet(AUTH_KEY) || 'null'); return a && a.access_token ? a : null; } catch(e){ return null; } })(),
  admin: null, data: null, loading: false, error: '', notice: '', loginError: '', loginBusy: false, loadedAt: null,
  tab: 'uebersicht', filter: {zeit:'alle', geraet:'alle', gruppe:'alle', fertig:false}, auto: false,
  edit: null, editError: '', armed: '', detail: null, busy: false
};
try { const u = JSON.parse(lsGet(UI_KEY) || 'null'); if(u){ if(u.tab) S.tab = u.tab; if(u.filter) Object.assign(S.filter, u.filter); } } catch(e){}
function saveUI(){ lsSet(UI_KEY, JSON.stringify({tab: S.tab, filter: S.filter})); }
function logout(msg){ S.auth = null; S.admin = null; S.data = null; lsDel(AUTH_KEY); S.loginError = msg || ''; render(); }
const testUrl = () => new URL('index.html', location.href).href;

/* ================= Daten laden ================= */
async function checkAdmin(){
  try { S.admin = (await api('rpc/ist_admin', {method:'POST', body:{}})) === true; }
  catch(e){ S.admin = false; S.error = e.message; }
}
async function loadData(){
  if(S.loading) return;
  S.loading = true; S.error = ''; render();
  try {
    const [sitzungen, ergebnisse, antworten, fragen, ereignisse] = await Promise.all([
      fetchAll('sitzungen?select=*&order=erstellt.desc,id.asc'),
      fetchAll('ergebnisse?select=*&order=sitzung_id.asc'),
      fetchAll('antworten?select=*&order=erstellt.asc,id.asc'),
      api('fragen?select=*&order=position.asc,erstellt.asc'),
      fetchAll('ereignisse?select=sitzung_id,erstellt,zeit_ms,typ,schritt,ansicht,daten&order=sitzung_id.asc,zeit_ms.asc,id.asc')
    ]);
    S.data = {sitzungen, ergebnisse, antworten, fragen: fragen || [], ereignisse};
    S.loadedAt = new Date();
  } catch(e){ S.error = 'Die Daten konnten nicht geladen werden: ' + e.message; }
  S.loading = false; render();
}
async function reloadQuestions(){ S.data.fragen = await api('fragen?select=*&order=position.asc,erstellt.asc') || []; }

/* ================= Auswertung ================= */
const STEP_LABEL = {intro:'Einwilligung', 't1-brief':'Aufgabe 1', t1:'Aufgabe 1', 't1-done':'Aufgabe 1', 't1-q':'Aufgabe 1', 't2-brief':'Aufgabe 2', t2:'Aufgabe 2', 't2-done':'Aufgabe 2', 't2-q':'Aufgabe 2', 't3-brief':'Aufgabe 3', t3:'Aufgabe 3', laden:'Fragebogen', fragen:'Fragebogen', sending:'Speichern', thanks:'Fertig', danach:'Fertig'};
const AREA_LABEL = {start:'Start', raeume:'Räume', 'raeume+karte':'Lageplan groß', chat:'Frag Campi', mensa:'Mensa', 'entdecken-studi':'Studileben', 'entdecken-stadt':'Stadtleben', einstellungen:'Einstellungen'};
const areaName = k => AREA_LABEL[k] || k;
function view(){
  const d = S.data; if(!d) return null;
  const f = S.filter, now = new Date();

/* ================= Diagramme ================= */
function empty(t){ return '<p class="empty">' + esc(t || 'Noch keine Daten.') + '</p>'; }
function bars(items, o){
  o = o || {};
  if(!items.length || items.every(i => !i.value) && !o.showZero) return empty(o.empty);
  const max = o.max || Math.max.apply(null, items.map(i => i.value)) || 1;
  return '<div class="bars">' + items.map(i => {
    const w = Math.max(0, Math.min(100, i.value / max * 100));
    const p = o.total ? pct(i.value, o.total) : null;
    const val = o.fmt ? o.fmt(i.value) : nf(i.value);
    const tip = i.tip || (i.label + ': ' + val + (p !== null ? ' (' + p + ' %)' : ''));
    return '<div class="bar-row" data-tip="' + esc(tip) + '"><span class="bl">' + esc(i.label) + '</span><span class="bt"><i class="' + (i.value ? '' : 'zero') + '" style="width:' + w.toFixed(1) + '%"></i></span>' +
      '<span class="bv">' + esc(val) + (p !== null ? '<small>' + p + ' %</small>' : '') + '</span></div>';
  }).join('') + '</div>';
}
function grouped(cats, series, o){
  o = o || {};
  const max = Math.max.apply(null, series.map(s => Math.max.apply(null, s.values.concat([0])))) || 1;
  if(series.every(s => !s.values.some(Boolean))) return empty(o.empty);
  return '<div class="legend">' + series.map((s, i) => '<span><i class="' + (i ? 's2' : '') + '"></i>' + esc(s.name) + (s.note ? ' · ' + esc(s.note) : '') + '</span>').join('') + '</div>' +
    '<div class="bars">' + cats.map((c, ci) => '<div class="gb-row"><span class="bl">' + esc(c) + '</span><div class="gb-bars">' +
      series.map((s, i) => { const v = s.values[ci] || 0; const p = s.total ? pct(v, s.total) : null; const tip = s.name + ' · ' + c + ': ' + nf(v) + (p !== null ? ' (' + p + ' %)' : '');
        return '<div class="gb-bar" data-tip="' + esc(tip) + '"><span class="bt"><i class="' + (i ? 's2' : '') + (v ? '' : ' zero') + '" style="width:' + (v / max * 100).toFixed(1) + '%"></i></span><span class="bv">' + (p !== null ? p + ' %' : nf(v)) + '</span></div>'; }).join('') +
    '</div></div>').join('') + '</div>';
}
function columns(points){
  if(!points.length) return empty();

  return '<div class="cols">' + points.map((p, i) => '<div class="col" data-tip="' + esc(p.label + ': ' + p.value + ' Teilnahmen') + '">' +
      ((i === maxIdx || i === points.length - 1) && p.value ? '<b style="bottom:' + (p.value / max * 100) + '%">' + p.value + '</b>' : '') +
      '<i style="height:' + (p.value / max * 100).toFixed(1) + '%"></i></div>').join('') + '</div>' +
    '<div class="col-l" aria-hidden="true">' + points.map((p, i) => '<span>' + (i % every === 0 ? esc(p.short) : '') + '</span>').join('') + '</div>';

function questionStats(q, answers, completed){

  const head = '<div class="mini"><div><b>' + n + '</b><span>Antworten</span></div>' + (completed ? '<div><b>' + pctTxt(pct(n, completed)) + '</b><span>der abgeschlossenen Tests</span></div>' : '');

    return head + '</div>' + (n ? '<div class="list">' + answers.slice().reverse().map(a => '<div class="list-row"><span class="lt">' + esc(a.wert) + '</span><span class="lm">' + esc(when(a.erstellt)) + '</span></div>').join('') + '</div>' : empty('Noch keine Antworten.'));
  }
  if(q.typ === 'skala'){
    const nums = vals.map(Number).filter(x => x >= 1 && x <= 5);
    return head + '<div><b>' + nf(mean(nums)) + '</b><span>Durchschnitt (1–5)</span></div><div><b>' + nf(median(nums)) + '</b><span>Median</span></div></div>' +

  }
  const counts = new Map((q.optionen || []).map(o => [o, 0]));
  vals.forEach(v => [].concat(v).forEach(o => counts.set(String(o), (counts.get(String(o)) || 0) + 1)));

/* ================= CSV ================= */
function csvCell(v){
  let s = typeof v === 'number' ? String(v).replace('.', ',') : Array.isArray(v) ? v.join(', ') : (v && typeof v === 'object') ? JSON.stringify(v) : String(v === undefined || v === null ? '' : v);
  if(/^[=+\-@]/.test(s)) s = "'" + s;
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csv(rows, cols){ return '﻿' + [cols.join(';')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(';'))).join('\r\n'); }
function download(name, text){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'text/csv;charset=utf-8'})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportSessions(v){
  const qcols = [], qkey = {};
  v.fragen.forEach(q => { qkey[q.id] = q.frage; qcols.push(q.frage); });
  v.ans.forEach(a => { const k = a.frage_id && qkey[a.frage_id] ? qkey[a.frage_id] : a.frage; if(!qcols.includes(k)) qcols.push(k); });
  const ans = {}; v.ans.forEach(a => { const k = a.frage_id && qkey[a.frage_id] ? qkey[a.frage_id] : a.frage; (ans[a.sitzung_id] = ans[a.sitzung_id] || {})[k] = a.wert; });
  const scols = ['id','erstellt','version','gruppe','geraet','betriebssystem','browser','sprache','zeitzone','bildschirm','fenster','pixeldichte','touch','dunkelmodus','weniger_bewegung','verbindung','quelle','kampagne','referrer','semester','letzte_raumsuche','ladezeit_ms'];
  const rcols = ['abgeschlossen','a1_ergebnis','a1_sekunden','a1_tipps','a1_weg','a1_verstaendlich','a2_ergebnis','a2_sekunden','a2_fragen','a2_vertrauen','a2_lieber','a3_sekunden','a3_bereiche','dauer_sekunden','fragebogen_sekunden','ereignisse'];
  const rows = v.sess.map(s => { const r = v.resBy[s.id] || {}; const o = Object.assign({}, s, r, {abgeschlossen: v.resBy[s.id] ? 'ja' : 'nein', ereignisse: (v.evBy[s.id] || []).length}); qcols.forEach(q => o[q] = (ans[s.id] || {})[q]); return o; });
  download('campi-teilnahmen-' + new Date().toISOString().slice(0, 10) + '.csv', csv(rows, scols.concat(rcols, qcols)));
}

    '<button class="btn btn-2 btn-sm" type="button" data-a="reload"' + (S.loading ? ' disabled' : '') + '>' + icon('refresh') + (S.loading ? 'Lädt …' : 'Aktualisieren') + '</button>' +
    (S.loadedAt ? '<span class="loaded">Stand ' + S.loadedAt.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) + '</span>' : '') + '</div>';
  if(S.error) body += '<div class="alert err" style="margin-bottom:16px"><b>Fehler</b>' + esc(S.error) + '</div>';
  if(S.notice) body += '<div class="alert" style="margin-bottom:16px" role="status">' + esc(S.notice) + '</div>';
  if(!v){ body += '<p class="note">Daten werden geladen …</p>'; }
  else if(S.tab === 'uebersicht') body += viewOverview(v);
  else if(S.tab === 'aufgaben') body += viewTasks(v);
  else if(S.tab === 'verhalten') body += viewBehavior(v);
  else if(S.tab === 'fragebogen') body += viewSurvey(v);
  else if(S.tab === 'fragen') body += viewQuestions();
  else if(S.tab === 'daten') body += viewData(v);
  app.innerHTML = '<div class="wrap' + (S.loading && S.data ? ' loading' : '') + '">' + top(right) + body + '</div>' + (S.detail && v ? detailHTML(v) : '');
  window.scrollTo(0, scrollY);
}

/* ================= Aktionen ================= */
async function onLogin(form){
  const email = form.email.value.trim(), password = form.password.value;
  S.loginEmail = email;
  if(!email || !password){ S.loginError = 'Bitte E-Mail und Passwort eingeben.'; return render(); }
  S.loginBusy = true; S.loginError = ''; render();
  try { const j = await authCall('password', {email, password}); setAuth(j, email); S.loginBusy = false; await start(); }
  catch(e){ S.loginBusy = false; S.loginError = e.message; render(); }
}
async function start(){
  S.admin = null; S.error = ''; render();
  await checkAdmin(); render();
  if(S.admin) await loadData();
}
function editFrom(q){ return q ? {id: q.id, frage: q.frage, typ: q.typ, hinweis: q.hinweis || '', optionen: (q.optionen || []).join('\n'), skala_min: q.skala_min || '', skala_max: q.skala_max || '', pflicht: q.pflicht, aktiv: q.aktiv}
  : {id: null, frage: '', typ: 'einfach', hinweis: '', optionen: '', skala_min: '', skala_max: '', pflicht: true, aktiv: true}; }
function readEditor(form){
  const e = S.edit;
  e.frage = form.frage.value; e.typ = form.typ.value; e.hinweis = form.hinweis.value;
  if(form.optionen) e.optionen = form.optionen.value;
  if(form.skala_min) e.skala_min = form.skala_min.value;
  if(form.skala_max) e.skala_max = form.skala_max.value;
  e.pflicht = form.pflicht.checked; e.aktiv = form.aktiv.checked;
}
async function saveQuestion(form){
  readEditor(form);
  const e = S.edit, choice = e.typ === 'einfach' || e.typ === 'mehrfach';
  const opts = Array.from(new Set(e.optionen.split('\n').map(x => x.trim()).filter(Boolean)));
  const err = !e.frage.trim() ? 'Bitte gib eine Frage ein.' : (choice && opts.length < 2) ? 'Bitte gib mindestens zwei Antwortmöglichkeiten ein, jede in einer eigenen Zeile.' : (opts.length > 20) ? 'Höchstens 20 Antwortmöglichkeiten.' : opts.some(o => o.length > 150) ? 'Eine Antwortmöglichkeit ist zu lang (höchstens 150 Zeichen).' : '';
  if(err){ S.editError = err; return render(); }
  const body = {frage: e.frage.trim().slice(0, 300), typ: e.typ, hinweis: e.hinweis.trim() || null, optionen: choice ? opts : [], skala_min: e.typ === 'skala' ? (e.skala_min.trim() || null) : null, skala_max: e.typ === 'skala' ? (e.skala_max.trim() || null) : null, pflicht: e.pflicht, aktiv: e.aktiv};
  S.busy = true; S.editError = ''; render();
  try {
    if(e.id) await api('fragen?id=eq.' + encodeURIComponent(e.id), {method:'PATCH', body, prefer:'return=minimal'});
    else { body.position = S.data.fragen.reduce((m, q) => Math.max(m, q.position || 0), 0) + 1; await api('fragen', {method:'POST', body, prefer:'return=minimal'}); }
    await reloadQuestions(); S.edit = null; S.notice = 'Gespeichert. Die Frage gilt ab sofort für neue Tests.';
  } catch(x){ S.editError = 'Speichern hat nicht geklappt: ' + x.message; }
  S.busy = false; render();
}
async function moveQuestion(id, dir){
  const qs = S.data.fragen.slice(), i = qs.findIndex(q => q.id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= qs.length) return;
  [qs[i], qs[j]] = [qs[j], qs[i]];
  S.busy = true; render();
  try {
    for(let k = 0; k < qs.length; k++){ if(qs[k].position !== k + 1) await api('fragen?id=eq.' + encodeURIComponent(qs[k].id), {method:'PATCH', body:{position: k + 1}, prefer:'return=minimal'}); }
    await reloadQuestions();
  } catch(x){ S.error = 'Die Reihenfolge konnte nicht gespeichert werden: ' + x.message; }
  S.busy = false; render();
}
async function toggleQuestion(id){
  const q = S.data.fragen.find(x => x.id === id); if(!q) return;
  S.busy = true; render();
  try { await api('fragen?id=eq.' + encodeURIComponent(id), {method:'PATCH', body:{aktiv: !q.aktiv}, prefer:'return=minimal'}); await reloadQuestions(); S.notice = q.aktiv ? 'Die Frage wird im Test nicht mehr gezeigt.' : 'Die Frage wird im Test wieder gezeigt.'; }
  catch(x){ S.error = 'Ändern hat nicht geklappt: ' + x.message; }
  S.busy = false; render();
}
async function deleteQuestion(id){
  S.busy = true; render();
  try { await api('fragen?id=eq.' + encodeURIComponent(id), {method:'DELETE', prefer:'return=minimal'}); await reloadQuestions(); S.notice = 'Frage gelöscht. Vorhandene Antworten bleiben unter „Fragebogen“ erhalten.'; }
  catch(x){ S.error = 'Löschen hat nicht geklappt: ' + x.message; }
  S.armed = ''; S.busy = false; render();
}
async function deleteSession(id){
  try {
    await api('sitzungen?id=eq.' + encodeURIComponent(id), {method:'DELETE', prefer:'return=minimal'});
    const d = S.data; d.sitzungen = d.sitzungen.filter(s => s.id !== id); d.ergebnisse = d.ergebnisse.filter(r => r.sitzung_id !== id); d.antworten = d.antworten.filter(a => a.sitzung_id !== id); d.ereignisse = d.ereignisse.filter(e => e.sitzung_id !== id);
    if(S.detail === id) S.detail = null;
    S.notice = 'Teilnahme gelöscht.';
  } catch(x){ S.error = 'Löschen hat nicht geklappt: ' + x.message; }
  S.armed = ''; render();
}
let armTimer = null;
function arm(key){ S.armed = key; clearTimeout(armTimer); armTimer = setTimeout(() => { if(S.armed === key){ S.armed = ''; render(); } }, 5000); render(); }

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  if(f.dataset.form === 'login') onLogin(f);
  if(f.dataset.form === 'q-save') saveQuestion(f);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.closest('[data-form="filter"]')){
    if(t.name === 'auto'){ S.auto = t.checked; return; }
    S.filter[t.name] = t.type === 'checkbox' ? t.checked : t.value; saveUI(); S.notice = ''; render();
  }
  if(t.form && t.form.dataset.form === 'q-save' && t.name === 'typ'){ readEditor(t.form); S.editError = ''; render(); const s = $('q-typ'); if(s) s.focus(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if(a !== 'q-del' && a !== 's-del' && S.armed){ S.armed = ''; }
  switch(a){
    case 'tab': S.tab = b.dataset.t; S.notice = ''; S.error = ''; saveUI(); render(); window.scrollTo(0, 0); break;
    case 'reload': S.notice = ''; loadData(); break;
    case 'logout': fetch(CONF.url + '/auth/v1/logout', {method:'POST', headers: hdrs(S.auth && S.auth.access_token)}).catch(() => {}); logout(''); break;
    case 'q-new': S.edit = editFrom(null); S.editError = ''; S.notice = ''; render(); { const i = $('q-frage'); if(i) i.focus(); } break;
    case 'q-edit': S.edit = editFrom(S.data.fragen.find(q => q.id === id)); S.editError = ''; S.notice = ''; render(); { const i = $('q-frage'); if(i) i.focus(); } break;
    case 'q-cancel': S.edit = null; S.editError = ''; render(); break;
    case 'q-up': moveQuestion(id, -1); break;
    case 'q-down': moveQuestion(id, 1); break;
    case 'q-toggle': toggleQuestion(id); break;
    case 'q-del': if(S.armed === 'q:' + id) deleteQuestion(id); else arm('q:' + id); break;
    case 's-del': if(S.armed === 's:' + id) deleteSession(id); else arm('s:' + id); break;
    case 'detail': S.detail = id; render(); { const c = document.querySelector('.drawer [data-a="detail-close"]'); if(c) c.focus(); } break;
    case 'detail-close': S.detail = null; render(); break;
    case 'csv-sess': exportSessions(view()); break;
    case 'csv-ev': { const v = view(); download('campi-ereignisse-' + new Date().toISOString().slice(0, 10) + '.csv', csv(v.ev, ['sitzung_id','erstellt','zeit_ms','typ','schritt','ansicht','daten'])); break; }
    case 'csv-ans': { const v = view(); download('campi-antworten-' + new Date().toISOString().slice(0, 10) + '.csv', csv(v.ans, ['sitzung_id','erstellt','frage','typ','wert'])); break; }
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.detail){ S.detail = null; render(); } });
/* tooltip */
const tip = $('tip');
function showTip(el, x, y){
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, y - h - 12) + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerleave', () => { tip.hidden = true; });
setInterval(() => { if(S.auto && S.admin && !S.loading && !S.edit && document.visibilityState === 'visible') loadData(); }, 30000);

/* ================= Start ================= */
render();
if(S.auth && !CONF.problem) start();
})();
</script>
